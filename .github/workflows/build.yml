name: Integration Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-gametests:
    name: Build + GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Validate JSON under src
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          failures = []
          for path in sorted(Path('src').rglob('*.json')):
              try:
                  with path.open(encoding='utf-8') as handle:
                      json.load(handle)
              except (OSError, json.JSONDecodeError) as error:
                  failures.append((path, error))
          if failures:
              for path, error in failures:
                  print(f'INVALID JSON: {path}: {error}')
              raise SystemExit(f'{len(failures)} invalid JSON file(s) found')
          print('All JSON files under src are valid.')
          PY
      - name: Clean build
        run: ./gradlew --no-daemon clean build --stacktrace
      - name: Run GameTests
        run: ./gradlew --no-daemon runGameTestServer --stacktrace
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-evidence-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/libs/*.jar
            build/reports/**
            build/test-results/**
            run/logs/**
            run/crash-reports/**
            runs/logs/**
            runs/crash-reports/**

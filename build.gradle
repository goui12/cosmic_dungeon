plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.106'
    id 'idea'
    id("io.github.themrmilchmann.curseforge-publish") version "0.8.0"
}

version = mod_version
group = mod_group_id

curseforge {
    apiToken = providers.gradleProperty('curseforgeApiToken').get()
    publications {
        named('neoForge') {
            projectId = providers.gradleProperty('curseforgeProjectId').get()
            artifacts.named('main') { }
        }
    }
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.8, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Default run configurations.
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // DATA: use a clean work dir so it won't load jars from run/mods
        data {
            clientData()
            // keep this dir separate to avoid picking up random mods
            gameDirectory = project.file('run-data')

            // Generate both client + server data
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators, but exclude Vowkeeper models
sourceSets.main {
    resources {
        srcDir 'src/generated/resources'
        exclude 'assets/cosmicdungeon/models/item/vowkeeper.json'
        exclude 'assets/cosmicdungeon/models/item/aegis_of_truth.json'
        exclude 'assets/cosmicdungeon/models/item/reinforced_iron_slab.json'
        exclude 'assets/cosmicdungeon/models/item/shield_of_the_deep.json'
        exclude 'assets/cosmicdungeon/models/item/shield_of_tidal_force.json'
        exclude 'assets/cosmicdungeon/models/item/worked_plank.json'


    }
}
tasks.processResources {
    // If there’s ever a duplicate resource, keep the first one and drop the rest
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Local, optional runtime deps (don’t get published)
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mods:
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"
}

// Expand replace properties into resources
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
sourceSets.main.resources.srcDir generateModMetadata
// Make IDE sync generate the metadata each reload
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
